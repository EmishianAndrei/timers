<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Трекер</title>
<meta name="description" content="Таймеры, трекер привычек, задачи, финансы и цели. База — ваша Google-таблица.">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header with tabs, one content column; tables scroll inside their own container */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --fg:#172030; --muted:#5d6779; --line:#d7dde6;
  --accent:#2457c5; --accent-fg:#ffffff; --accent-soft:#e3ebfb;
  --gblue:#1a73e8; --gblue-soft:#e8f0fe; --red:#d93025; --good:#1f8a5b; --good-soft:#dcf1e6; --warn:#b7791f; --bad:#c23b3b; --bad-soft:#f8e1e1;
  --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10141b; --surface:#171d27; --surface-2:#1d2430; --fg:#e6eaf1; --muted:#8e98a9; --line:#2a3344;
  --accent:#6f9dff; --accent-fg:#0d1320; --accent-soft:#1d2a45;
  --gblue:#8ab4f8; --gblue-soft:#1f2c44; --red:#f28b82; --good:#4cc38a; --good-soft:#163527; --warn:#e0a84a; --bad:#ef6b6b; --bad-soft:#3a1e22; color-scheme:dark}}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:70px;width:100%}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0}
input[type=number]{width:7em}
input[type=time]{width:7.5em}
select{padding-right:6px}

.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* навигация: боковое меню (ПК — всегда видно, телефон — выезжает), на телефоне ещё нижняя панель */
:root{--side-w:236px}
.side{position:fixed;top:0;bottom:0;left:0;z-index:60;width:var(--side-w);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px calc(12px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 14px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.side .side-x{display:none;font-size:22px}
.side-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.side-l{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.side-l:first-child{padding-top:2px}
.side-sp{flex:1;min-height:12px}
.side-nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--fg);font-weight:500;text-align:left;font-size:15px}
.side-nav button svg{flex:none;color:var(--muted)}
.side-nav button:hover{background:var(--surface-2)}
.side-nav button[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.side-nav button[aria-current=page] svg{color:var(--accent)}
.side-sync{margin:10px 6px 0;align-self:flex-start}
.remind-list summary{cursor:pointer;color:var(--accent);margin-top:6px}
.remind-list .item input[type=time]{width:7.2em}
.side-bg{position:fixed;inset:0;z-index:55;background:rgba(10,14,20,.42)}
.top{display:none}
.bottom{display:none}
body{padding-left:var(--side-w)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--good)} .sync.busy i{background:var(--accent);animation:pulse 1s infinite} .sync.err i{background:var(--bad)} .sync.off i{background:var(--warn)}
@media (max-width:900px){
  body{padding-left:0}
  .side{transform:translateX(-102%);transition:transform .22s ease;box-shadow:none;width:min(300px,84vw);padding-top:calc(14px + env(safe-area-inset-top,0px))}
  body.side-open .side{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.25)}
  body.side-open{overflow:hidden}
  .side .side-x{display:inline-grid}
  .side-sync{display:none}
  .top{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--line);
    padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px))}
  .top .brand{margin-right:auto;font-size:17px}
  .burger{width:40px;height:40px;color:var(--fg)}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
main{padding-block:20px 60px}
.view{display:flex;flex-direction:column;gap:20px}

/* common blocks */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-danger{color:var(--bad)}
.btn-sm{padding:4px 9px;font-size:13px;border-radius:7px}
.icon{width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);font-size:16px;flex:none}
.icon:hover{background:var(--surface-2);color:var(--fg)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:5px 12px;border-radius:7px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.datenav{display:flex;align-items:center;gap:6px}
.datenav button.icon{border:1px solid var(--line);background:var(--surface)}
.datenav .d{min-width:140px;text-align:center;font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.tag-good{background:var(--good-soft);color:var(--good);border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#202124;color:#fff;padding:12px 16px;border-radius:6px;font-size:14px;z-index:60;max-width:calc(100% - 32px);display:flex;align-items:center;gap:18px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.toast-btn{color:#8ab4f8;font-weight:600;padding:2px 4px}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* timers */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{--c:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.run{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.card .head{display:flex;align-items:center;gap:8px;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.card.run .dot{animation:pulse 1.6s infinite}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:32px;font-weight:500;letter-spacing:-.02em;line-height:1}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.go{padding:7px 16px;border-radius:999px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.go.ghost{background:transparent}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.preset{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-family:var(--f-num);color:var(--muted)}
.preset:hover{border-color:var(--c);color:var(--fg);background:var(--surface-2)}
.card.run .go{background:var(--c);border-color:var(--c);color:#fff}
.edit{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px;font-size:13.5px}
.edit label{display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.grouphead{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.rows{display:flex;flex-direction:column;gap:9px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:center}
.srow .n{display:flex;align-items:center;gap:8px;min-width:0}
.srow .n span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .p{font-size:13px;color:var(--muted);width:3.2em;text-align:right}
.sbar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:4px}
.tl{position:relative;height:24px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.tl i{position:absolute;top:0;bottom:0;min-width:2px}
.ticks{position:relative;height:14px;font-size:11px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%)} .ticks span:first-child{transform:none} .ticks span:last-child{transform:translateX(-100%)}
.week{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.yax{position:relative;width:36px;font-size:11px;color:var(--muted)} .yax span{position:absolute;right:0;transform:translateY(50%)}
.plot{position:relative;height:160px;border-bottom:1px solid var(--line)}
.plot .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;padding:0 4px}
.col{display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden}
.col.sel{outline:2px solid var(--fg);outline-offset:2px}
.xax{grid-column:2;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:0 4px;font-size:11.5px;color:var(--muted);text-align:center}
.xax button{border-radius:6px;padding:2px 0} .xax b{display:block;color:var(--fg)}

/* tracker day */
.sec{display:flex;flex-direction:column;gap:2px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;min-height:42px}
.item+.item{border-top:1px dashed var(--line)}
.item .lbl{min-width:0;flex:1}
.item .ctl{display:flex;align-items:center;gap:6px;flex:none}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.step button{width:32px;height:32px;color:var(--muted);font-size:17px}
.step button:hover{background:var(--surface-2);color:var(--fg)}
.step span{min-width:3.2em;text-align:center;font-family:var(--f-num)}
.auto{font-size:12px;color:var(--accent)}
.sum{display:flex;justify-content:space-between;font-weight:600;padding-top:6px}

/* tracker month table */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:75vh}
table.m{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
table.m th,table.m td{padding:4px 5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
table.m thead th{position:sticky;top:0;background:var(--surface);z-index:2;font-weight:500;color:var(--muted)}
table.m th.first,table.m td.first{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;max-width:190px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
table.m thead th.first{z-index:3}
table.m td.cell{cursor:pointer;min-width:34px;font-family:var(--f-num)}
table.m td.cell:hover{background:var(--accent-soft)}
table.m .we{background:var(--surface-2)}
table.m .today{box-shadow:inset 1px 0 var(--accent),inset -1px 0 var(--accent)}
table.m tr.sh td{background:var(--surface-2);font-weight:600;text-align:left}
table.m tr.tot td{font-weight:600}
table.m td.agg{font-weight:600;border-left:1px solid var(--line)}
.on{color:var(--good);font-weight:700}
.av{color:var(--accent)}

/* tasks */
.tasks{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.lists{display:flex;flex-direction:column;gap:2px}
.lists button.l{display:flex;justify-content:space-between;gap:8px;text-align:left;padding:7px 10px;border-radius:8px}
.lists button.l[aria-current=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.lists .g{margin-top:10px;padding:0 10px}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .t{flex:1;min-width:0;cursor:pointer}
.task .t .tt{overflow-wrap:anywhere}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.over{color:var(--bad)!important}
.star{color:var(--muted)} .star.on{color:var(--warn)}
.listsel{display:none}

/* finance */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .v{font-family:var(--f-num);font-size:20px;font-weight:600;margin-top:2px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.ops .op{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.ops .op .n{flex:1;min-width:0}
.ops .day{margin-top:10px;font-weight:600}
.gcat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:14px}
.gcat .gname{grid-column:1/-1;margin-top:8px;font-weight:600}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form>*{flex:0 1 auto}

/* goals */
.goal{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.goal.ok .gn{color:var(--good)}
.goal .gt{font-size:13px;color:var(--muted)}
.goal .gp{font-family:var(--f-num);font-size:13.5px;text-align:right}
.wk{border-collapse:collapse;font-size:13.5px}
.wk th,.wk td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center}
.wk td:first-child,.wk th:first-child{text-align:left}
.wk td.ok{background:var(--good-soft)}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kcol{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;justify-content:space-between}
.li.done span{text-decoration:line-through;color:var(--muted)}

/* tooltip */
.tip{position:fixed;left:0;top:0;z-index:70;background:#202124;color:#fff;padding:6px 9px;border-radius:6px;font-size:12.5px;line-height:1.35;white-space:pre-line;pointer-events:none;max-width:260px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.swatch{width:22px;height:22px;border-radius:50%;background:var(--c)}
.time.over{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;padding-top:4px}
.legend .lg{display:inline-flex;align-items:center;gap:6px;cursor:default}
.linkbtn{color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-size:13px;padding:0}
.ended{opacity:.55}
input.dur{width:4.6em;text-align:center;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;padding:6px 4px}
.meal{display:inline-flex;gap:6px;align-items:center}
.meal .mnum{width:4.2em;text-align:center}

/* charts */
.cframe{display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px}
.cplot{position:relative;border-bottom:1px solid var(--line)}
.cplot .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.ccols{position:absolute;inset:0;display:grid;gap:2px;align-items:end}
.ccol{display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden;min-height:0}
.ccol i,.ccol i:hover{display:block}
.ccol i:hover,.hc[data-tip]:hover,.sbarv:hover{filter:brightness(1.12)}
.cx{display:grid;gap:2px;font-size:10.5px;color:var(--muted);text-align:center;margin-top:3px}
.cx .today{color:var(--accent);font-weight:700}
.cline{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cdot{position:absolute;width:9px;height:9px;margin:0 0 -4.5px -4.5px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.cdot:hover{background:var(--accent)}
.avgline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.8}
.avgline span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--muted);background:var(--surface);padding:0 3px}
.sbarv{position:absolute;border-radius:4px;background:var(--accent);opacity:.85}
.hgrid{display:flex;flex-direction:column;gap:4px;overflow-x:auto}
.hrow{display:grid;grid-template-columns:minmax(110px,180px) minmax(260px,1fr) 64px;gap:10px;align-items:center;font-size:13.5px}
.hname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hval{text-align:right;color:var(--muted);font-size:12.5px}
.hcells{display:grid;gap:2px;height:22px}
.hc{display:block;border-radius:3px;background:var(--surface-2);position:relative}
.hc.ok{background:var(--good)}
.hc.fut{background:transparent;border:1px dashed var(--line)}
.hc.na{background:transparent}
.hc.nb{background:var(--surface-2);display:flex;align-items:flex-end;overflow:hidden}
.hc.nb b{display:block;width:100%;background:var(--accent);border-radius:2px 2px 0 0}
.hc.nb s{position:absolute;left:50%;width:7px;height:7px;margin:0 0 -3.5px -3.5px;border-radius:50%;background:var(--accent);text-decoration:none}
@media (max-width:720px){.hrow{grid-template-columns:96px minmax(220px,1fr) 52px}.cx{font-size:9.5px}}

/* recipes */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.recipe .rnum{font-weight:700;color:var(--accent);font-size:15px}
.panel.warn{border-color:var(--warn);background:var(--surface);gap:6px}
.panel.warn b{color:var(--warn)}
.pre{white-space:pre-wrap;font-size:14px;margin-top:2px}
.ntab{border-collapse:collapse;font-size:14px;width:100%}
.ntab th,.ntab td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right}
.ntab th{font-weight:500;color:var(--muted);font-size:12.5px}
.ntab td:first-child,.ntab th:first-child{text-align:left}

/* Google-Tasks-style */
.gt-wrap{display:flex;justify-content:center}
.gt{width:100%;max-width:640px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 0 10px;font-size:14px}
.gt-top{padding:2px 20px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border-bottom:1px solid var(--line)}
.gt-label{font-size:11px;letter-spacing:.8px;color:var(--muted);font-weight:500}
.gt-listbtn{display:inline-flex;align-items:center;gap:2px;font-size:22px;font-weight:400;padding:2px 4px 2px 0;border-radius:6px}
.gt-listbtn:hover{background:var(--surface-2)}
.gt-group{font-size:12px;color:var(--muted)}
.gt-addrow{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 6px 14px}
.gt-add{display:inline-flex;align-items:center;gap:14px;color:var(--gblue);font-weight:500;padding:8px 12px 8px 8px;border-radius:999px;font-size:15px}
.gt-add:hover{background:var(--gblue-soft)}
.gt-body{display:flex;flex-direction:column}
.gt-task{display:grid;grid-template-columns:18px 32px minmax(0,1fr) 36px;align-items:start;padding:6px 12px 6px 4px;position:relative;border-top:1px solid transparent;border-bottom:1px solid transparent}
.gt-task:not(.edit):hover{background:var(--surface-2)}
.gt-task.sub{padding-left:40px}
.gt-task.edit{background:var(--surface);box-shadow:0 1px 3px rgba(60,64,67,.25),0 4px 8px rgba(60,64,67,.12);border-radius:8px;margin:4px 8px;padding:8px 12px 8px 0}
.gt-task.edit.sub{margin-left:44px;padding-left:0}
.gt-handle{color:var(--muted);opacity:0;cursor:grab;display:flex;align-items:center;justify-content:center;padding-top:4px}
.gt-task:hover .gt-handle{opacity:.7}
.gt-check{width:32px;height:32px;display:grid;place-items:center;color:var(--muted);border-radius:50%;margin-top:-4px}
.gt-check .ck{opacity:0}
.gt-check:hover{color:var(--gblue)}
.gt-check:hover .ck{opacity:1}
.gt-check.on{color:var(--gblue)}
.gt-task.completing .gt-check{color:var(--gblue)}
.gt-task.completing .ck{opacity:1}
.gt-task.completing{opacity:.4;transition:opacity .25s}
.gt-main{min-width:0;display:flex;flex-direction:column;gap:3px;padding:2px 0;cursor:text}
.gt-title{font-size:14.5px;overflow-wrap:anywhere;line-height:1.4}
.gt-notes{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.gt-meta{font-size:12px;color:var(--muted)}
.gt-task.done .gt-title{text-decoration:line-through;color:var(--muted)}
.gt-star{width:32px;height:32px;display:grid;place-items:center;color:var(--muted);border-radius:50%;opacity:0;margin-top:-4px}
.gt-task:hover .gt-star,.gt-star.on,.gt-task.edit .gt-star{opacity:1}
.gt-star.on{color:var(--gblue)}
.gt-star:hover{background:var(--surface-2);color:var(--fg)}
.gt-in-title{border:0;padding:2px 0;font-size:14.5px;background:transparent;border-radius:0;width:100%}
.gt-in-notes{border:0;padding:2px 0;font-size:13px;background:transparent;border-radius:0;min-height:0;resize:none;color:var(--muted);width:100%}
.gt-in-title:focus,.gt-in-notes:focus{outline:none}
.gt-editbar{display:flex;align-items:center;gap:6px;margin-top:4px;position:relative}
.gt-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 9px;font-size:13px;color:var(--fg);width:max-content;background:transparent}
.gt-chip.sm{padding:2px 9px 2px 7px;font-size:12px;margin-top:2px}
.gt-chip.today{color:var(--gblue);border-color:var(--gblue)}
.gt-chip.over{color:var(--red);border-color:var(--red)}
button.gt-chip:hover{background:var(--surface-2)}
.gt-date-input{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;padding:0;border:0;pointer-events:none}
.icon.sm{width:24px;height:24px}
.gt-sec{padding:12px 20px 4px 54px;font-size:13px;font-weight:600;color:var(--fg)}
.gt-sec.over{color:var(--red)}
.gt-empty{padding:28px 20px;text-align:center;color:var(--muted)}
.gt-donebox{border-top:1px solid var(--line);margin-top:6px;padding-top:4px}
.gt-done-h{display:flex;align-items:center;gap:8px;padding:8px 16px;font-weight:500;width:100%;text-align:left}
.gt-done-h svg{transition:transform .15s}
.gt-done-h.open svg{transform:rotate(90deg)}
.gt-trash{opacity:0}
.gt-task.done:hover .gt-trash{opacity:1}
.gt-task.dragging{opacity:.35}
.gt-task.drop-before{border-top:2px solid var(--gblue)}
.gt-task.drop-after{border-bottom:2px solid var(--gblue)}
@media (hover:none){.gt-star,.gt-trash{opacity:1}.gt-handle{display:none}.gt-task{grid-template-columns:4px 32px minmax(0,1fr) 36px}}

/* menus & dialogs */
.pop-anchor{position:relative;display:inline-flex}
.pop{position:absolute;top:calc(100% + 4px);left:0;z-index:40;min-width:240px;max-width:min(320px,calc(100vw - 32px));max-height:60vh;overflow:auto;background:var(--surface);border-radius:8px;padding:8px 0;box-shadow:0 2px 6px rgba(60,64,67,.3),0 6px 16px rgba(60,64,67,.18);font-size:14px}
.pop.right{left:auto;right:0}
.pop-h{padding:8px 16px 4px;font-size:12px;color:var(--muted);font-weight:500}
.pop-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 16px;min-height:36px}
.pop-i:hover:not(:disabled){background:var(--surface-2)}
.pop-ic{width:20px;display:inline-grid;place-items:center;color:var(--gblue)}
.pop-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-n{color:var(--muted);font-size:12.5px}
.pop-sep{height:1px;background:var(--line);margin:6px 0}
.modal-bg{position:fixed;inset:0;z-index:55;background:rgba(32,33,36,.45);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:22px 24px 16px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.modal h3{font-size:18px;font-weight:500}
.modal input{border:0;border-bottom:2px solid var(--gblue);border-radius:0;padding:6px 2px;background:transparent}
.modal input:focus{outline:none}
.btn-flat{border:0;background:transparent;color:var(--gblue)}
.btn-flat-primary{border:0;background:transparent;color:var(--gblue)}
.btn-dangerfill{border:0;background:transparent;color:var(--red)}
.btn-flat:hover,.btn-flat-primary:hover,.btn-dangerfill:hover{background:var(--gblue-soft)}

/* ===== v4: «Сегодня», серии, карта, инсайты, бюджеты, нижнее меню ===== */
.panel{box-shadow:0 1px 2px rgba(16,24,40,.04)}
.hello{font-size:24px;font-weight:700;letter-spacing:-.01em}
.tile.tbtn{text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:border-color .15s}
.tile.tbtn:hover{border-color:var(--accent)}
.tile .v{font-size:22px}
.pbar,.bbar{display:block;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px;position:relative}
.pbar i{display:block;height:100%;background:var(--good);border-radius:3px}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.tlist{display:flex;flex-direction:column}
.trow{--c:var(--accent);display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.trow:first-child{border-top:0}
.trow .tval{font-size:15px;color:var(--muted)}
.trow.run .tval{color:var(--fg);font-weight:600}
.trow .tval.over{color:var(--bad)}
.trow .go{padding:5px 12px;min-width:44px}
.trow.run .go{background:var(--c);border-color:var(--c);color:#fff}
.trow.run .dot{animation:pulse 1.6s infinite}
.hgroup{display:flex;flex-direction:column;gap:2px}
.hgroup+.hgroup{margin-top:8px}
.hcheck{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer}
.hcheck:hover{background:var(--surface-2)}
.hcheck input{width:20px;height:20px;accent-color:var(--good)}
.hcheck .hc-t{flex:1}
.hcheck.on .hc-t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.st{font-size:12.5px;color:var(--warn);font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;background:var(--surface)}
.chipbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.today-tasks .gt-task{grid-template-columns:0 32px minmax(0,1fr) 28px;padding:4px 0}
.today-tasks .gt-star{opacity:1;pointer-events:none}
.macros{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px}
.macros i{font-style:normal;color:var(--muted)}
.amt{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding-right:8px}
.amt input{border:0;width:4.2em;text-align:right;padding:8px 4px 8px 8px;background:transparent}
.amt i{font-style:normal;color:var(--muted);font-size:12.5px}
.meal{flex-wrap:wrap;justify-content:flex-end}
.prods{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.pchip{display:inline-flex;align-items:center;gap:4px;padding:4px 4px 4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--fg);font-size:13.5px}
.pchip button{width:22px;height:22px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.pchip button:hover{background:var(--surface);color:var(--bad)}
.item:has(.prods){flex-wrap:wrap;gap:6px 12px}
.item:has(.meal){flex-wrap:wrap;gap:6px 12px}
.item:has(.meal) .lbl{flex:1 1 160px}
.item:has(.meal) .ctl{flex:1 1 auto;justify-content:flex-end}
/* Трекер: неделя */
table.wk{font-size:14px;table-layout:fixed;width:100%;min-width:620px}
table.wk th.first,table.wk td.first{width:200px;max-width:200px}
table.wk thead th{padding:8px 4px}
table.wk thead th .wd{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
table.wk thead th .dn{display:block;font-size:17px;font-weight:600;color:var(--fg);font-family:var(--f-num)}
table.wk thead th.today .dn{color:var(--accent)}
table.wk thead th:last-child{width:72px}
table.wk td.wc{padding:3px}
table.wk td.wc.today{background:var(--accent-soft)}
table.wk td.first{padding:6px 10px}
.wchk{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line-2,var(--line));display:inline-grid;place-items:center;font-size:17px;color:#fff;font-weight:700;transition:background .12s,border-color .12s}
.wchk:hover{border-color:var(--c,var(--accent))}
.wchk.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.future .wchk{opacity:.45}
.wval{width:100%;min-height:34px;border-radius:8px;font-family:var(--f-num);font-size:13px;padding:2px}
.wval:hover{background:var(--surface-2)}
.wval .ph{color:var(--muted);opacity:0;font-size:16px}
.wval:hover .ph,.wval:focus-visible .ph{opacity:1}
.secbtn{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--fg)}
.secbtn .chev{width:12px;color:var(--muted);font-size:11px}
table.m tr.sh td.first{box-shadow:inset 3px 0 var(--c,transparent)}
/* Трекер: месяц — тепловая сетка */
table.mheat{table-layout:fixed;width:100%;min-width:640px}
table.mheat col.c1{width:190px}
table.mheat col.c2{width:64px}
table.mheat th{padding:6px 0;font-size:11px}
table.mheat td.mhc{padding:2px 1px;border-bottom:0}
table.mheat td.first{padding:3px 8px;font-size:12.5px;border-bottom:0}
table.mheat tr.sh td{padding-top:8px;border-bottom:0}
table.mheat td.agg{font-size:12px;border-bottom:0}
.sq{display:block;width:100%;max-width:22px;aspect-ratio:1;margin:auto;border-radius:4px;background:var(--surface-2);border:0;padding:0}
.sq.off{background:transparent}
.sq.on{background:color-mix(in srgb,var(--c,var(--accent)) var(--a,100%),var(--surface-2))}
button.sq{cursor:pointer}
button.sq:hover{outline:2px solid var(--fg);outline-offset:1px}
table.mheat td.today .sq:not(.on){box-shadow:inset 0 0 0 1.5px var(--accent)}
table.mheat td.we{background:transparent}
table.mheat thead th.we{background:var(--surface-2)}
table.mheat thead th.today{color:var(--accent);font-weight:700}
@media (max-width:700px){table.wk th.first,table.wk td.first{width:120px;max-width:120px}table.mheat col.c1{width:120px}}
/* режим «Настроить» на панелях */
.editbtn{text-decoration:none;font-weight:600}
.editbtn[aria-pressed=true]{color:var(--fg)}
.erow .lbl{display:flex;flex-direction:column;gap:2px}
.erow .ename{width:100%;min-width:0;padding:5px 8px}
.erow .ctl{gap:2px}
.hid-h{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.addrow{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.sec-h .row,.bar>.row{gap:10px;align-items:center}
.streaks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.streak{text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;background:var(--surface)}
.streak:hover{border-color:var(--muted)}
.streak.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.streak .sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.streak .sv{display:flex;align-items:baseline;gap:3px;font-size:18px}
.streak .sv i{font-style:normal;font-size:14px}
.streak .sm{grid-column:1/-1}
.streak .sbar{grid-column:1/-1;height:5px}
.hmwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;overflow-x:auto}
.hmdays{display:grid;grid-template-rows:14px repeat(7,12px);gap:3px;font-size:10px;color:var(--muted)}
.hmgrid{display:grid;grid-auto-flow:column;grid-auto-columns:12px;gap:3px}
.hmc{display:grid;grid-template-rows:14px repeat(7,12px);gap:3px}
.hmm{font-size:10px;color:var(--muted);white-space:nowrap}
.hm{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.hm.f,.hm.l-1{background:transparent;border-color:transparent}
.hm.l1{background:color-mix(in srgb,var(--good) 30%,var(--surface));border-color:transparent}
.hm.l2{background:color-mix(in srgb,var(--good) 55%,var(--surface));border-color:transparent}
.hm.l3{background:color-mix(in srgb,var(--good) 78%,var(--surface));border-color:transparent}
.hm.l4{background:var(--good);border-color:transparent}
.hmleg{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.insights{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ins{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.ins p{margin:0;font-size:14.5px}
.ins-tag{font-size:12px;font-weight:600;width:max-content;padding:2px 8px;border-radius:999px}
.ins-tag.up{background:var(--good-soft);color:var(--good)}
.ins-tag.down{background:var(--bad-soft);color:var(--bad)}
.kc{height:60px}
.budgets{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.bud{display:flex;flex-direction:column;gap:4px}
.bbar{height:8px;overflow:visible}
.bbar i{display:block;height:100%;border-radius:4px;background:var(--good)}
.bud.warn .bbar i{background:var(--warn)}
.bud.over .bbar i{background:var(--bad)}
.bbar s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.45}
.sess summary{cursor:pointer;color:var(--accent);font-size:14px;margin-top:4px}
.sess .op{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.sess .op .n{flex:1;min-width:0}
@media (max-width:720px){
  main{padding-bottom:96px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;
    padding:4px max(6px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px));box-shadow:0 -2px 10px rgba(16,24,40,.06)}
  .bottom button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;font-size:11px;min-width:0;color:var(--muted);font-weight:500}
  .bottom button span{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
  .bottom button svg{width:22px;height:22px}
  .bottom button[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
  .hello{font-size:20px}
  .dash{grid-template-columns:1fr}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}

@media (max-width:720px){
  .tasks{grid-template-columns:1fr}
  .lists{display:none}
  .listsel{display:flex}
  .time{font-size:28px}
  .datenav .d{min-width:0}
  .cols,.xax{gap:5px}
}
</style>

    <button type="button" data-act="tab" data-tab="recipes"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2.2 1.2-3.5 3.6-3.5 7v4H17"/></svg><span>Еда</span></button>
    <button type="button" data-act="tab" data-tab="finance"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 15h2"/><path d="M6 6l9-3 1.2 3"/></svg><span>Финансы</span></button>
